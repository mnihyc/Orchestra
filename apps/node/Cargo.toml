[package]
name = "orch-node"
description = "Compose the host runtime service with configured environment drivers."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The Kubernetes driver is kept for a later release and is not loaded by the node unless this is built in.
kubernetes = ["dep:orch-driver-kubernetes"]

[dependencies]
orch-adapter-codex.workspace = true
orch-adapter-claude-code.workspace = true
orch-agent-contract.workspace = true
orch-agent-programs.workspace = true
orch-conformance.workspace = true
orch-testkit.workspace = true
tempfile.workspace = true
anyhow.workspace = true
async-trait.workspace = true
bollard.workspace = true
clap.workspace = true
futures.workspace = true
orch-blob-contract.workspace = true
orch-api-contract.workspace = true
orch-build-info.workspace = true
orch-config.workspace = true
orch-connector-core.workspace = true
orch-driver-contract.workspace = true
orch-driver-docker.workspace = true
orch-driver-host.workspace = true
orch-driver-kubernetes = { workspace = true, optional = true }
orch-plugin.workspace = true
orch-plugin-contract.workspace = true
orch-link-contract.workspace = true
orch-node-core.workspace = true
orch-telemetry.workspace = true
orch-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[build-dependencies]
orch-build-support.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["ioctl"] }
rustix.workspace = true

[dev-dependencies]
orch-envhost.workspace = true
base64.workspace = true
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
hex.workspace = true
orch-access-contract.workspace = true
orch-api-contract.workspace = true
orch-api-core.workspace = true
orch-authz.workspace = true
orch-db.workspace = true
orch-engine.workspace = true
orch-gateway-core.workspace = true
orch-link.workspace = true
orch-pki.workspace = true
rand.workspace = true
sha2.workspace = true
sqlx.workspace = true
tar.workspace = true

[lints]
workspace = true
