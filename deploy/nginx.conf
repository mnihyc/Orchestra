# The web edge of the stack: it serves the built application and carries the
# API and machines' link to the services behind it. HTTPS may be served here
# with Orch's authority, or by the operator's front; see docs/operator.

worker_processes auto;
user nginx;
# Where a read-only container may write.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 75s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # Docker's own name service. A service is looked up when a request needs
    # it, not once when nginx starts, so that a service made again by an update
    # is found at its new address without nginx being restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The scheme the browser used, as the HTTPS edge in front says it; this
    # edge itself sees plain HTTP.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # What a browser may keep. The built files under /assets/ are named by their
    # content and kept for good; the page that names them is never kept, so a
    # new release is seen at once; what the services answer says for itself.
    # (One definition here, because a header that a location adds takes the
    # server's own headers away from that location.)
    map "$status:$uri" $orch_cache_control {
        default                    "no-store";
        ~^(200|206|304):/assets/   "public, max-age=31536000, immutable";
        ~^\d+:/(api|link)/         "";
        ~^\d+:/health$             "";
    }

    # Where the body of `orchctl doctor --url` lands. The edge buffers a request
    # and reads all of its body before it asks this address, so whatever stands in
    # front of the edge has to carry a body of 8 MiB whole to get an answer, and
    # one that cuts or refuses it is found out. Nothing is done with the body.
    server {
        listen 127.0.0.1:8081;
        return 204;
    }

    # A port's stable name (e<environment>-p<port> under the ports domain) goes to the API
    # whatever its path: the API lets in, or refuses, by the entry the request carries, and
    # answers for the program. A link's proof can be in the query, so nothing is logged here;
    # the program's own pages keep their own headers.
    server {
        listen 80;
        include /tmp/ports-https.conf;
        # Quoted: unquoted, nginx reads the braces of the count as a block and refuses the file.
        server_name "~^e[0-9a-f]{32}-p[0-9]+\.";
        access_log off;
        client_max_body_size 8m;

        location / {
            set $upstream https://api:8443;
            proxy_ssl_name api;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_trusted_certificate /etc/orch/secrets/orch_ca_cert.pem;
            proxy_ssl_server_name on;
            # A program streams (events, downloads, sockets): nothing is held back to be kept whole.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
        }
    }

    server {
        listen 80 default_server;
        include /tmp/frontend-https.conf;
        server_name _;
        root /usr/share/nginx/html;

        # On every response, including the ones nginx makes itself.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: https:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'" always;
        add_header Cache-Control $orch_cache_control always;

        # No single request carries more than 8 MiB: the browser sends larger
        # content in pieces of at most 4 MiB, and so do connectors.
        client_max_body_size 8m;

        # What the services see of the request.
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Append the connection peer: a caller's existing chain never supplies
        # the last hop. Upstreams trust only the proxy ranges they name.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # A request that asks to become a WebSocket is passed on as one. (Set
        # here and not in the locations that need it: a location that sets a
        # header of its own loses the ones set above it.)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The services' certificates are checked against the system's own
        # authority, by the name of the service.
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_trusted_certificate /etc/orch/secrets/orch_ca_cert.pem;
        proxy_ssl_server_name on;

        # The realtime socket and the terminals. The prefix covers
        # /api/v1/ws/terminals/... and /api/v1/ws/agent-terminals/...
        location /api/v1/ws {
            set $upstream https://api:8443;
            proxy_ssl_name api;
            proxy_pass $upstream$request_uri;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        location /api/ {
            set $upstream https://api:8443;
            proxy_ssl_name api;
            proxy_pass $upstream$request_uri;
            # A download starts at once and is not held back to be kept whole.
            proxy_buffering off;
        }

        location = /edge-check {
            proxy_pass http://127.0.0.1:8081;
        }

        location = /health {
            set $upstream https://api:8443;
            proxy_ssl_name api;
            proxy_pass $upstream$request_uri;
        }

        # Coarse installation progress remains available while the API is applying its schema.
        location = /update-status {
            alias /var/lib/orch-update-status/migrations.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }

        # A machine that comes in through this edge.
        location /link/v1/session {
            set $upstream https://gateway:9444;
            proxy_ssl_name gateway;
            proxy_pass $upstream$request_uri;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        location /link/ {
            set $upstream https://gateway:9444;
            proxy_ssl_name gateway;
            proxy_pass $upstream$request_uri;
        }

        # The services' own internal addresses are not for this edge.
        location /internal/ {
            return 404;
        }

        location /assets/ {
            try_files $uri =404;
        }

        # Every other address is a screen of the application.
        location / {
            try_files $uri /index.html;
        }
    }
}
