# Executable composition, grouped libraries and contract implementations.
# docs/development/architecture.md documents ownership and dependency direction.
[workspace]
resolver = "3"
members = [
    "apps/api",
    "apps/connector",
    "apps/ctl",
    "apps/gateway",
    "apps/node",
    "apps/worker",
    "crates/contracts/access",
    "crates/contracts/agent",
    "crates/contracts/agent-programs",
    "crates/contracts/api",
    "crates/contracts/blob",
    "crates/contracts/driver",
    "crates/contracts/executor",
    "crates/contracts/identity",
    "crates/contracts/link",
    "crates/contracts/model",
    "crates/contracts/notifier",
    "crates/contracts/plugin",
    "crates/contracts/provider",
    "crates/contracts/realtime",
    "crates/contracts/settings",
    "crates/contracts/summarizer",
    "crates/control/api",
    "crates/control/authz",
    "crates/control/chat",
    "crates/control/db",
    "crates/control/documents",
    "crates/control/engine",
    "crates/control/gateway",
    "crates/control/settings",
    "crates/control/worker",
    "crates/foundation/build-info",
    "crates/foundation/types",
    "crates/platform/config",
    "crates/platform/conformance",
    "crates/platform/link",
    "crates/platform/pki",
    "crates/platform/plugin",
    "crates/platform/telemetry",
    "crates/runtime/connector",
    "crates/runtime/envhost",
    "crates/runtime/node",
    "crates/tooling/build-support",
    "crates/tooling/stress",
    "crates/tooling/testkit",
    "crates/tooling/xtask",
    "extensions/agents/acp",
    "extensions/agents/claude-code",
    "extensions/agents/codex",
    "extensions/agents/fake",
    "extensions/blobs/local",
    "extensions/drivers/docker",
    "extensions/drivers/host",
    "extensions/drivers/kubernetes",
    "extensions/executors/codex",
    "extensions/executors/orch",
    "extensions/identity/oidc",
    "extensions/notifiers/email",
    "extensions/notifiers/push",
    "extensions/notifiers/telegram",
    "extensions/notifiers/webhook",
    "extensions/protocols/anthropic-messages",
    "extensions/protocols/openai-responses",
    "extensions/providers/deepseek",
    "extensions/providers/openrouter",
    "extensions/summarizers/model",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97.0"
repository = "https://github.com/mnihyc/Orchestra"
publish = false

[workspace.dependencies]
# Workspace crates.
orch-access-contract = { path = "crates/contracts/access" }
orch-adapter-acp = { path = "extensions/agents/acp" }
orch-adapter-claude-code = { path = "extensions/agents/claude-code" }
orch-adapter-codex = { path = "extensions/agents/codex" }
orch-adapter-fake = { path = "extensions/agents/fake" }
orch-agent-contract = { path = "crates/contracts/agent" }
orch-agent-programs = { path = "crates/contracts/agent-programs" }
orch-api = { path = "apps/api" }
orch-api-contract = { path = "crates/contracts/api" }
orch-api-core = { path = "crates/control/api" }
orch-authz = { path = "crates/control/authz" }
orch-blob-contract = { path = "crates/contracts/blob" }
orch-blob-local = { path = "extensions/blobs/local" }
orch-build-info = { path = "crates/foundation/build-info" }
orch-build-support = { path = "crates/tooling/build-support" }
orch-chat = { path = "crates/control/chat" }
orch-config = { path = "crates/platform/config" }
orch-conformance = { path = "crates/platform/conformance" }
orch-connector = { path = "apps/connector" }
orch-connector-core = { path = "crates/runtime/connector" }
orch-db = { path = "crates/control/db" }
orch-documents = { path = "crates/control/documents" }
