name: CI

on:
  push:
    # A branch under ci-t/ runs only its targeted checks (ci-targeted.yml).
    branches: ['**', '!ci-t/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # The deployment scenarios package two releases and run stacks on Docker: an hour and more,
  # so they run each night, by hand and for release tags, not on every branch push.
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    # The slowest platform leg, macOS on Intel, took 199 minutes on B27 and passed 210 on B28 (cancelled in its
    # executable identity step, after 31 minutes of documentation). Keep about 45 minutes of headroom over the
    # slowest leg without holding the release gate for six hours.
    timeout-minutes: 270
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      # These debug builds check and run executables, without needing debug info.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare memory for Linux compilation
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/ci_memory.sh
          printf '%s\n' 'CARGO_BUILD_JOBS=1' >> "$GITHUB_ENV"
      - name: Install the repository toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-rust
          cache-bin: 'false'
      - name: Check formatting
        # Formatting does not depend on the platform, and on Windows cargo fmt passes a package's files to rustfmt in
        # one command line that is longer than Windows allows (os error 206).
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      # Every check runs even when one before it failed, and each keeps going past a crate that fails, so that one run
      # lists every finding of every crate instead of the first layer of them.
      - name: Compile scaffold
        if: ${{ !cancelled() }}
        run: cargo check --workspace --all-targets --locked --keep-going
      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      - name: Start PostgreSQL for connector restart tests
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        uses: ankane/setup-postgres@b1a598d92f86cb2ed364411898d150d4eac6d5ca # v1
        with:
          postgres-version: 17
          user: orch
      - name: Test environment host and connector
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        timeout-minutes: 45
        env:
          RUST_MIN_STACK: "16777216"
          ORCH_TEST_DATABASE_URL: postgres://orch@127.0.0.1:5432/postgres
        run: cargo test --locked --no-fail-fast -p orch-envhost -p orch-connector-core -p orch-connector
      - name: Check documentation
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked --keep-going
      - name: Check executable identity
        if: ${{ !cancelled() }}
        run: cargo run --locked -p orchctl -- version --json
      - name: Keep release inputs unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code -- Cargo.lock build/build-numbers

  musl:
    name: Machine and CLI compilation (${{ matrix.target }})
    # Each target on a runner of its own architecture: the C parts of ring and blake3 need a musl C compiler
    # for the target, which musl-tools gives natively and no x86 runner has for aarch64.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-musl}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare memory for static compilation
        run: bash .github/scripts/ci_memory.sh
      - name: Install the musl C compiler
        # The distribution mirror's name at times does not resolve, for minutes or for hours: each attempt
        # first puts the mirrors that answer at the head of the list, and a failed installation is tried
        # again, up to four more times, after growing waits.
        run: |
          wait=30
          for attempt in 1 2 3 4 5; do
            bash .github/scripts/ci_apt_mirror.sh
            sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools && exit 0
            echo "Installing the musl C compiler failed (attempt $attempt of 5)."
            if [ "$attempt" != 5 ]; then sleep "$wait"; wait=$((wait * 2)); fi
          done
          exit 1
      - name: Install the repository toolchain
        run: rustup show
      - name: Compile static machine placeholders and CLI
        # Keep optimized static compilation on one Cargo job, with swap for the
        # largest crate. Release settings are the same as native packaging.
        run: cargo build --release --locked -j 1 -p orchctl -p orch-connector -p orch-node --target ${{ matrix.target }}

  dependencies:
    name: Dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check immutable release inputs offline
        run: python3 -I -B scripts/release/stock-images.py --check
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --locked

  tests:
    name: Rust tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [api-0, api-1, api-2, api-3, api-4, api-5, api-6, api-7, engine-0, engine-1, engine-2, rest-0, rest-1, rest-2, rest-3]
    services:
      # The database the deployment runs, by the same digest.
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: orch
          POSTGRES_PASSWORD: orch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ORCH_TEST_DATABASE_URL: postgres://orch:orch@127.0.0.1:5432/postgres
      # Small test binaries and no incremental objects keep each shard within runner disk limits.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      # Keep the large libraries and their test harnesses from compiling concurrently.
      CARGO_BUILD_JOBS: '1'
      # Debug futures of the API and the engine outgrow the default 2 MiB thread stack, as the servers' own 8 MiB
      # workers acknowledge; the cases that must hold on default stacks run themselves again without this.
      RUST_MIN_STACK: "33554432"
    steps:
      - name: Free unused runner toolchains
        run: |
          ls -ld /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the deployment database search extensions
        if: startsWith(matrix.shard, 'api-') || startsWith(matrix.shard, 'engine-')
        env:
          ORCH_CI_POSTGRES: ${{ job.services.postgres.id }}
        # Service containers start before checkout. Build the same pinned extension
        # files as deployment and add them before any fixture template is migrated.
        run: |
          set -euo pipefail
          docker build --tag orch-ci-database ./deploy/postgres
          docker run --rm --entrypoint tar orch-ci-database -C /usr/local -cf - lib/postgresql/vector.so lib/postgresql/pg_bigm.so share/postgresql/extension |
            docker exec -i "$ORCH_CI_POSTGRES" tar -C /usr/local -xf -
          docker exec "$ORCH_CI_POSTGRES" psql -U orch -d postgres -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_bigm;'
      - name: Prepare memory for test compilation
        run: bash .github/scripts/ci_memory.sh
      - name: Install the repository toolchain
        run: rustup show
      # Every shard restores one dependency-only cache; the first API shard saves it once.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-tests
          save-if: ${{ matrix.shard == 'api-0' }}
          cache-bin: 'false'
      # The generated types come from the web app's own openapi-typescript, read from its lock file.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: matrix.shard == 'rest-0'
        with:
          node-version-file: frontend/.nvmrc
      - name: Install the web app from its lock file
        if: matrix.shard == 'rest-0'
        working-directory: frontend
        run: npm ci
      - name: Check the generated contracts
        if: matrix.shard == 'rest-0'
        run: cargo xtask contracts --check
      - name: Check test shard coverage
        if: ${{ !cancelled() && matrix.shard == 'rest-0' }}
        run: python3 -I -B -m unittest discover -s .github/scripts -p 'test_ci_*.py'
      - name: Build the connector the tests start
        if: ${{ !cancelled() }}
        run: cargo build --locked -p orch-connector
      - name: Plan the assigned native fixtures
        if: ${{ !cancelled() }}
        id: native-fixtures
        run: |
          fixture_plan=$(python3 -I -B .github/scripts/ci_fixtures.py --shard '${{ matrix.shard }}' --plan)
          printf 'plan=%s\n' "$fixture_plan" >> "$GITHUB_OUTPUT"
      - name: Install the native fixtures' C compiler
        if: ${{ !cancelled() && (fromJSON(steps.native-fixtures.outputs.plan).node_runner || fromJSON(steps.native-fixtures.outputs.plan).node_connector) }}
        # The distribution mirror's name at times does not resolve, for minutes or for hours: each attempt
        # first puts the mirrors that answer at the head of the list, and a failed installation is tried
        # again, up to four more times, after growing waits.
        run: |
          wait=30
          for attempt in 1 2 3 4 5; do
            bash .github/scripts/ci_apt_mirror.sh
            sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools && exit 0
            echo "Installing the musl C compiler failed (attempt $attempt of 5)."
            if [ "$attempt" != 5 ]; then sleep "$wait"; wait=$((wait * 2)); fi
          done
          exit 1
      - name: Prepare the assigned tests' Docker fixtures
        if: ${{ !cancelled() }}
        run: python3 -I -B .github/scripts/ci_fixtures.py --shard '${{ matrix.shard }}'
      - name: Run every test program
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/ci_test_shard.py --shard '${{ matrix.shard }}'
      - name: Report remaining runner disk
        if: ${{ !cancelled() }}
        run: |
          df -h /
          if [ -d target ]; then du -sh target; fi

  test-result:
    name: Rust tests (PostgreSQL)
    if: ${{ always() }}
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - name: Report the combined result of all shards
        env:
          SHARD_RESULT: ${{ needs.tests.result }}
        run: test "$SHARD_RESULT" = success

  web-analysis:
    name: Web types and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: frontend/.nvmrc
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

  web-build:
    name: Web units and production build
    runs-on: ubuntu-24.04
    # The unit suite takes about twenty minutes; the limit keeps one stalled file from ending the job
    # before the browser plan is made.
    timeout-minutes: 120
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: frontend/.nvmrc
      - run: npm ci
        working-directory: frontend
      - name: Check the committed plugin bundle
        run: npm run check
        working-directory: extensions/agents/acp/dsh-bridge
      - name: Unit and component tests
        if: ${{ !cancelled() }}
        run: npm run test
        working-directory: frontend
      - name: Build the one production artifact
        if: ${{ !cancelled() }}
        env:
          ORCH_BUILD_NUMBER_DIR: ${{ github.workspace }}/.tmp/ci-web-build-numbers
        run: npm run build
        working-directory: frontend
      - name: Discover this checkout's complete browser inventory
        if: ${{ !cancelled() }}
        env:
          ORCH_E2E_NO_DEV_SERVER: '1'
        run: |
          mkdir -p ../.tmp/ci-web
          node node_modules/playwright/cli.js test --list --reporter=json > ../.tmp/ci-web/inventory.json
        working-directory: frontend
      - name: Check allocation and report-reconciliation controls
        if: ${{ !cancelled() }}
        run: python3 -I -B -m unittest discover -s .github/scripts -p 'test_ci_web.py'
      - name: Plan every discovered case exactly once
        if: ${{ !cancelled() }}
        id: plan
        run: python3 -I -B .github/scripts/ci_web.py plan --inventory .tmp/ci-web/inventory.json
      - name: Seal the production artifact to source and lock
        if: ${{ !cancelled() }}
        run: python3 -I -B .github/scripts/ci_web.py seal
      - id: artifact
        if: ${{ !cancelled() }}
        run: echo "name=web-build-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            frontend/dist/
            .tmp/ci-web/
          include-hidden-files: true
          if-no-files-found: error

  web-browser:
    name: Web browser (${{ matrix.name }})
    needs: web-build
    if: ${{ !cancelled() && needs.web-build.outputs.matrix != '' }}
    runs-on: ubuntu-24.04
    # A group is planned for half an hour of passing cases. Failing cases run to their timeouts and are
    # retried, so the limit leaves a failing group the time to finish and report every case.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.web-build.outputs.matrix || '{"include":[{"name":"unavailable"}]}') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: frontend/.nvmrc
      - run: npm ci
        working-directory: frontend
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.web-build.outputs.artifact }}
      - name: Install the repository browser
        # Its system packages come from a distribution mirror whose name at times does not resolve, for
        # minutes or for hours: each attempt first puts the mirrors that answer at the head of the list, and
        # a failed installation is tried again, up to four more times, after growing waits.
        run: |
          wait=30
          for attempt in 1 2 3 4 5; do
            bash ../.github/scripts/ci_apt_mirror.sh
            npx playwright install --with-deps chromium && exit 0
            echo "The browser installation failed (attempt $attempt of 5)."
            if [ "$attempt" != 5 ]; then sleep "$wait"; wait=$((wait * 2)); fi
          done
          exit 1
        working-directory: frontend
      - name: Verify selectors and run the complete assigned inventory
        run: python3 -I -B .github/scripts/ci_web.py run --group '${{ matrix.name }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: web-report-${{ matrix.name }}-${{ github.run_attempt }}
          path: .tmp/ci-web-reports/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ failure() }}
        with:
          name: web-failure-${{ matrix.name }}-${{ github.run_attempt }}
          path: .tmp/ci-web-results/
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0

  web:
    name: Web application
    if: ${{ always() }}
    needs: [web-analysis, web-build, web-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.web-build.outputs.artifact }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ !cancelled() }}
        with:
          pattern: web-report-*
          path: .tmp/ci-web-reports/
          merge-multiple: true
      - name: Reconcile the actual report union with final discovery
        if: ${{ !cancelled() }}
        run: python3 -I -B .github/scripts/ci_web.py audit
      - name: Require every static and browser result
        if: ${{ always() }}
        env:
          ANALYSIS: ${{ needs.web-analysis.result }}
          BUILD: ${{ needs.web-build.result }}
          BROWSERS: ${{ needs.web-browser.result }}
        run: test "$ANALYSIS" = success && test "$BUILD" = success && test "$BROWSERS" = success
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: web-coverage-${{ github.run_attempt }}
          path: .tmp/ci-web/coverage.json
          include-hidden-files: true
          if-no-files-found: error

  deploy-smoke:
    name: Deployment scenarios
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    # Packaging compiles the control API's release build. On a hosted runner's memory that needs one build job
    # and added swap, as the release workflow's package job has, and then takes hours: the limit is the host's.
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare memory for server packaging
        run: bash .github/scripts/ci_memory.sh
      - name: Install the repository toolchain
        run: rustup show
      - name: Package two releases and run every scenario on Docker
        env:
          ORCH_SMOKE_RUN: ci${{ github.run_id }}
        run: bash scripts/smoke/run-all.sh
