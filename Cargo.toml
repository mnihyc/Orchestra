orch-executor-contract = { path = "crates/contracts/executor" }
orch-executor-orch = { path = "extensions/executors/orch" }
orch-gateway = { path = "apps/gateway" }
orch-gateway-core = { path = "crates/control/gateway" }
orch-identity-contract = { path = "crates/contracts/identity" }
orch-identity-oidc = { path = "extensions/identity/oidc" }
orch-link = { path = "crates/platform/link" }
orch-link-contract = { path = "crates/contracts/link" }
orch-model-contract = { path = "crates/contracts/model" }
orch-node = { path = "apps/node" }
orch-node-core = { path = "crates/runtime/node" }
orch-notifier-contract = { path = "crates/contracts/notifier" }
orch-notifier-email = { path = "extensions/notifiers/email" }
orch-notifier-push = { path = "extensions/notifiers/push" }
orch-notifier-telegram = { path = "extensions/notifiers/telegram" }
orch-notifier-webhook = { path = "extensions/notifiers/webhook" }
orch-pki = { path = "crates/platform/pki" }
orch-plugin = { path = "crates/platform/plugin" }
