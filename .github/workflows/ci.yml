name: CI

on:
  push:
    # A branch under ci-t/ runs only its targeted checks (ci-targeted.yml).
    branches: ['**', '!ci-t/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  messages:
    uses: ./.github/workflows/public-history.yml

  rust:
    name: Rust (${{ matrix.os }})
    # The slowest platform leg, macOS on Intel, takes about 200 minutes with a cache and, compiling from nothing
    # without the plain check, about 230 (lint 90, connector tests 36, documentation 34, the executable's own
    # build about 60). Keep about 45 minutes of headroom over that without holding the release gate for six hours.
    timeout-minutes: 270
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      # These debug builds check and run executables, without needing debug info.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare memory for Linux compilation
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/ci_memory.sh
          printf '%s\n' 'CARGO_BUILD_JOBS=1' >> "$GITHUB_ENV"
      - name: Install the repository toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-rust
          cache-bin: 'false'
          # A leg that fails or runs out of time has still compiled: keep that for the next run of the branch.
          cache-on-failure: 'true'
      - name: Check formatting
        # Formatting does not depend on the platform, and on Windows cargo fmt passes a package's files to rustfmt in
        # one command line that is longer than Windows allows (os error 206).
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      # Every check runs even when one before it failed, and each keeps going past a crate that fails, so that one run
      # lists every finding of every crate instead of the first layer of them.
      # The plain check lists the errors of crates that a denied lint in a crate below them would hide from the
      # lint step. It runs on Linux only: the lint step compiles the same code on every platform, and on the
      # slowest leg the two together (72 and 90 minutes from nothing on Intel macOS) ran the job out of its time.
      - name: Compile scaffold
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: cargo check --workspace --all-targets --locked --keep-going
      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      - name: Start PostgreSQL for connector restart tests
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        uses: ankane/setup-postgres@b1a598d92f86cb2ed364411898d150d4eac6d5ca # v1
        with:
          postgres-version: 17
          user: orch
      - name: Test environment host and connector
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        timeout-minutes: 45
        env:
          RUST_MIN_STACK: "16777216"
          ORCH_TEST_DATABASE_URL: postgres://orch@127.0.0.1:5432/postgres
        run: cargo test --locked --no-fail-fast -p orch-envhost -p orch-connector-core -p orch-connector
      - name: Check documentation
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked --keep-going
      - name: Check executable identity
        if: ${{ !cancelled() }}
        run: cargo run --locked -p orchctl -- version --json
      - name: Keep release inputs unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code -- Cargo.lock build/build-numbers

