[package]
autotests = false
name = "orch-api-core"
description = "API application hosting HTTP, realtime and the machine backplane."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
test-observers = ["orch-link/test-observers", "orch-api-base/test-observers", "orch-api-threads/test-observers", "orch-api-documents/test-observers", "orch-api-resources/test-observers", "orch-api-environments/test-observers", "orch-api-admin/test-observers", "orch-api-collaboration/test-observers", "orch-api-interactive/test-observers"]
test-support = []

[dependencies]
