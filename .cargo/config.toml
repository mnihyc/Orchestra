# The connector, the node and the CLI ship as static musl binaries. Linking
# them with the linker bundled in the Rust toolchain needs no system cross
# linker for either architecture.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

[alias]
xtask = "run --locked --quiet --package orch-xtask --"
