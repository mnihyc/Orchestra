orch-summarizer-contract = { path = "crates/contracts/summarizer" }
orch-summarizer-model = { path = "extensions/summarizers/model" }
orch-telemetry = { path = "crates/platform/telemetry" }
orch-testkit = { path = "crates/tooling/testkit" }
orch-types = { path = "crates/foundation/types" }
orch-worker = { path = "apps/worker" }
orch-worker-core = { path = "crates/control/worker" }
