name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release version tag (a future tag is allowed for rehearsal or cache warming)
        required: true
        default: v0.1.2
        type: string
      rehearsal:
        description: Build and assemble the dispatched snapshot without creating a tag, release or images
        required: true
        default: false
        type: boolean
      warm_caches:
        description: Warm caches from the default branch without publishing a release or images
        required: true
        default: false
        type: boolean
      source_run_id:
        description: Completed release run whose native and frontend artifacts should be reused (optional)
        required: false
        type: string
      publish_images:
        description: Publish the default image after its terms and release-images environment are approved
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '4'

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.gate.outputs.tag || steps.rehearsal.outputs.tag || steps.warm.outputs.tag }}
      version: ${{ steps.gate.outputs.version || steps.rehearsal.outputs.version || steps.warm.outputs.version }}
      commit: ${{ steps.gate.outputs.commit || steps.rehearsal.outputs.commit || steps.warm.outputs.commit }}
      source_frontend: ${{ steps.source.outputs.frontend }}
      ci_ref: ${{ steps.gate.outputs.ci_ref || steps.rehearsal.outputs.ci_ref }}
      native_matrix: ${{ steps.contract.outputs.native_matrix }}
      package_matrix: ${{ steps.contract.outputs.package_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ (inputs.warm_caches || inputs.rehearsal) && github.sha || inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Prepare a cache-only build of the default branch
        if: inputs.warm_caches
        id: warm
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REHEARSAL: ${{ inputs.rehearsal }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PUBLISH_IMAGES: ${{ inputs.publish_images }}
        run: python3 .github/scripts/release_warmup.py
      - name: Pin the non-publishing snapshot rehearsal
        if: inputs.rehearsal
        id: rehearsal
        env:
          WARM_CACHES: ${{ inputs.warm_caches }}
          PUBLISH_IMAGES: ${{ inputs.publish_images }}
        run: python3 .github/scripts/release_rehearsal.py
      - name: Gate the exact tag and commit
        if: ${{ !inputs.warm_caches && !inputs.rehearsal }}
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_gate.py
      - name: Check the source release run
        if: inputs.source_run_id != ''
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          COMMIT: ${{ steps.gate.outputs.commit || steps.rehearsal.outputs.commit }}
        run: python3 .github/scripts/release_source.py
      - name: Refuse image publication during repackaging
        if: inputs.source_run_id && inputs.publish_images
        run: |
          echo '::error::Repackaging only creates packages and a release; publish images in a separate approved run.'
          exit 1
      - name: Record the exact schema, transport and platform inputs
        id: contract
        env:
          COMMIT: ${{ steps.gate.outputs.commit || steps.rehearsal.outputs.commit || steps.warm.outputs.commit }}
          RELEASE_MODE: ${{ inputs.warm_caches && 'warm' || inputs.rehearsal && 'rehearsal' || 'release' }}
        run: python3 .github/scripts/release_contract.py record --commit "$COMMIT" --tag "$RELEASE_TAG" --mode "$RELEASE_MODE" --out .tmp/release-inputs.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-inputs
          path: .tmp/release-inputs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Release helper behavior
        run: python3 -I -B -m unittest discover -s .github/scripts -p 'test_release_*.py'
      - name: Lint the workflows in the pinned tooling image
        run: python3 .github/scripts/workflow_lint.py

  ci:
    if: ${{ !inputs.warm_caches }}
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 310
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.commit }}
      - name: Wait for the exact ref and commit's full CI
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REF: ${{ needs.gate.outputs.ci_ref }}
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: python3 .github/scripts/release_ci.py --ref "$CI_REF" --commit "$COMMIT" ${{ inputs.rehearsal && '--require-dispatch' || '' }}

  native:
    needs: gate
    if: ${{ !inputs.source_run_id }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.native_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      ORCH_RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      ORCH_RELEASE_TAG: ${{ needs.gate.outputs.tag }}
      ORCH_BUILD_NUMBER_DIR: ${{ github.workspace }}/.tmp/release-counters
      CARGO_TARGET_DIR: ${{ github.workspace }}/.tmp/release-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.commit }}
      # The cache action identifies dependencies by their location outside the checkout.
      - name: Prepare Linux native builder cache
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/orch-builder-cargo-home" "$GITHUB_WORKSPACE/.tmp/release-target/container"
          ln -s "$RUNNER_TEMP/orch-builder-cargo-home" "$GITHUB_WORKSPACE/.tmp/release-target/container/cargo-home"
      # Linux builds run in the pinned builder with its own Cargo home and target.
      - name: Restore Linux native dependencies
        if: runner.os == 'Linux'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          CARGO_HOME: ${{ runner.temp }}/orch-builder-cargo-home
        with:
          key: native-${{ matrix.target }}
          workspaces: . -> .tmp/release-target/container/target
          cache-bin: 'false'
      - name: Restore native dependencies
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: native-${{ matrix.target }}
          workspaces: . -> .tmp/release-target
          cache-bin: 'false'
      - name: Linux native tests, connector build and actual version command
        if: runner.os == 'Linux'
        env:
          CARGO_HOME: ${{ runner.temp }}/orch-builder-cargo-home
        run: python .github/scripts/release_native.py --target ${{ matrix.target }} --out .tmp/native
      - name: Native tests, connector build and actual version command
        if: runner.os != 'Linux'
        run: python .github/scripts/release_native.py --target ${{ matrix.target }} --out .tmp/native
      - name: Observe the candidate connector on its native platform
        id: observe
        if: runner.os != 'Linux' && !inputs.warm_caches
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: python .github/scripts/release_observe.py --target ${{ matrix.target }} --native .tmp/native --out observations
      - name: Retain native platform observations even on failure
        if: always() && runner.os != 'Linux' && !inputs.warm_caches
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inv15-${{ matrix.target }}
          path: observations/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: .tmp/native/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  frontend:
    needs: gate
    if: ${{ !inputs.source_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ORCH_RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      ORCH_RELEASE_TAG: ${{ needs.gate.outputs.tag }}
      ORCH_BUILD_NUMBER_DIR: ${{ github.workspace }}/.tmp/release-counters
      CARGO_TARGET_DIR: ${{ github.workspace }}/.tmp/release-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.commit }}
      - name: Restore frontend identity dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: frontend
          workspaces: . -> .tmp/release-target
          cache-bin: 'false'
      - name: Restore web application downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tmp/npm-cache
          key: release-npm-${{ hashFiles('frontend/.nvmrc', 'frontend/package-lock.json') }}
          restore-keys: release-npm-
      - name: Build and record the frontend once
        run: python3 .github/scripts/release_frontend.py --out .tmp/frontend-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: .tmp/frontend-output/*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          overwrite: true

  # The command-line program for the Linux packages. Its musl build compiles most of the server again and, with one
  # rustc at a time, takes about as long as the server programs, so it is built here beside them rather than after
  # them inside the package job's six hours.
  cli:
    needs: gate
    if: ${{ !inputs.source_run_id }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.package_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      # One rustc at a time inside the builder, as for the server programs.
      CARGO_BUILD_JOBS: '1'
      ORCH_RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      ORCH_RELEASE_TAG: ${{ needs.gate.outputs.tag }}
      ORCH_BUILD_NUMBER_DIR: ${{ github.workspace }}/.tmp/release-counters
      CARGO_TARGET_DIR: ${{ github.workspace }}/.tmp/release-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.commit }}
      - name: Prepare memory for the command-line build
        run: bash .github/scripts/ci_memory.sh
      - name: Prepare command-line builder cache
        run: |
          mkdir -p "$RUNNER_TEMP/orch-builder-cargo-home" "$GITHUB_WORKSPACE/.tmp/release-target/container"
          ln -s "$RUNNER_TEMP/orch-builder-cargo-home" "$GITHUB_WORKSPACE/.tmp/release-target/container/cargo-home"
      - name: Restore command-line builder dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          CARGO_HOME: ${{ runner.temp }}/orch-builder-cargo-home
        with:
          key: cli-${{ matrix.arch }}
          workspaces: . -> .tmp/release-target/container/target
          cache-bin: 'false'
      - name: Build the command-line program
        env:
          CARGO_HOME: ${{ runner.temp }}/orch-builder-cargo-home
        run: python3 .github/scripts/ci_memory_watch.py cargo xtask package --cli-only --out .tmp/cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.arch }}
          path: .tmp/cli/orchctl
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  package:
    needs: [gate, native, frontend, cli]
    if: >-
      ${{ !cancelled() && needs.gate.result == 'success' &&
          ((needs.native.result == 'success' && needs.frontend.result == 'success' && needs.cli.result == 'success') ||
           (inputs.source_run_id && needs.native.result == 'skipped' && needs.frontend.result == 'skipped' && needs.cli.result == 'skipped')) }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.package_matrix) }}
    runs-on: ${{ matrix.os }}
    # Six hours: with one build job (the control API's release build against a hosted runner's memory, D-1657) the
    # server took 105 minutes and the static programs as long again on the fourth rehearsal; the unnesting brings it down.
    timeout-minutes: 360
    env:
      # One rustc at a time inside the builder: the control API crate's release build alone takes most of a hosted
      # runner's memory since the deep async layouts (D-1657); the musl CI job compiles the same crate with -j 1.
      CARGO_BUILD_JOBS: '1'
      ORCH_RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      ORCH_RELEASE_TAG: ${{ needs.gate.outputs.tag }}
      ORCH_BUILD_NUMBER_DIR: ${{ github.workspace }}/.tmp/release-counters
      CARGO_TARGET_DIR: ${{ github.workspace }}/.tmp/release-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.commit }}
      - name: Prepare memory for server packaging
        run: bash .github/scripts/ci_memory.sh
      - name: Prepare server builder cache
        run: |
          mkdir -p "$RUNNER_TEMP/orch-builder-cargo-home" "$GITHUB_WORKSPACE/.tmp/release-target/container"
          ln -s "$RUNNER_TEMP/orch-builder-cargo-home" "$GITHUB_WORKSPACE/.tmp/release-target/container/cargo-home"
      - name: Restore server builder dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          CARGO_HOME: ${{ runner.temp }}/orch-builder-cargo-home
        with:
          key: package-${{ matrix.arch }}
          workspaces: . -> .tmp/release-target/container/target
          cache-bin: 'false'
      - name: Restore web application downloads for release notices
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tmp/npm-cache
          key: release-npm-${{ hashFiles('frontend/.nvmrc', 'frontend/package-lock.json') }}
          restore-keys: release-npm-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: .tmp/native-inputs
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ !inputs.source_run_id || needs.gate.outputs.source_frontend == 'true' }}
        with:
          name: frontend-dist
          path: .tmp/frontend-input
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
      - name: Build the frontend when an older source run has none
        if: inputs.source_run_id && needs.gate.outputs.source_frontend == 'false'
        env:
          CARGO_HOME: ${{ runner.temp }}/orch-builder-cargo-home
        run: python3 .github/scripts/release_frontend.py --out .tmp/frontend-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ !inputs.source_run_id }}
        with:
          name: cli-${{ matrix.arch }}
          path: .tmp/cli-input
      - name: Package and validate all connector downloads
        env:
          CARGO_HOME: ${{ runner.temp }}/orch-builder-cargo-home
        # A run repackaging an older run's inputs builds the command-line program itself.
        run: |
          cli=()
          if [ -f .tmp/cli-input/orchctl ]; then chmod +x .tmp/cli-input/orchctl; cli=(--cli .tmp/cli-input/orchctl); fi
          python3 .github/scripts/ci_memory_watch.py python3 .github/scripts/release_package.py --inputs .tmp/native-inputs --frontend .tmp/frontend-input --out .tmp/package "${cli[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.arch }}
          path: .tmp/package/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  images:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images && !inputs.warm_caches && !inputs.rehearsal
    needs: [gate, ci, assemble]
    environment: release-images
    permissions:
      contents: read
      packages: write
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.package_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REHEARSAL: ${{ inputs.rehearsal }}
      WARM_CACHES: ${{ inputs.warm_caches }}
      ORCH_RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      ORCH_RELEASE_TAG: ${{ needs.gate.outputs.tag }}
      ORCH_BUILD_NUMBER_DIR: ${{ github.workspace }}/.tmp/release-counters
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.commit }}
      - name: Publish approved native image with verified recipe labels
        run: python3 .github/scripts/release_image.py --arch ${{ matrix.arch }} --out .tmp/image
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.arch }}
          path: .tmp/image/*.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  assemble:
    if: ${{ !inputs.warm_caches }}
    needs: [gate, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ORCH_BUILD_NUMBER_DIR: ${{ github.workspace }}/.tmp/release-counters
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: .tmp/packages
      - name: Assemble both architectures and verify the complete candidate
        env:
          RELEASE_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.gate.outputs.tag }}
        run: python3 .github/scripts/release_assemble.py --inputs .tmp/packages --out .tmp/release --base-url "$RELEASE_BASE_URL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: .tmp/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: always() && !cancelled() && !inputs.warm_caches && !inputs.rehearsal && needs.gate.result == 'success' && needs.ci.result == 'success' && needs.assemble.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped')
    needs: [gate, ci, assemble, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      ORCH_BUILD_NUMBER_DIR: ${{ github.workspace }}/.tmp/release-counters
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: .tmp/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.images.result == 'success'
        with:
          pattern: image-*
          path: .tmp/images
      - name: Publish the verified release after rechecking CI
        env:
          PUBLISH_IMAGES: ${{ needs.images.result == 'success' }}
          REHEARSAL: ${{ inputs.rehearsal }}
          WARM_CACHES: ${{ inputs.warm_caches }}
        run: python3 .github/scripts/release_publish.py --release .tmp/release --repo "$GITHUB_REPOSITORY" --images .tmp/images
