name: Feature request
description: Something you want Orch to do.
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What do you want to do?
      description: Describe the work you are trying to get done, not the feature you imagine.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What do you do today?
      description: How you get it done now, and what is hard about that.
  - type: textarea
    attributes:
      label: What would help
      description: What you would like to see, if you have an idea.
