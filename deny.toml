[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"

[licenses]
# These permissive terms can accompany Apache-2.0 code. Release packaging
# retains the dependency licenses, copyright notices and exact source URLs.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause", # arrayref, under the SVG renderer of file previews
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # redistributable certificate-root data, with its terms
    "ISC",
    "MIT",
    "MIT-0", # MIT without the attribution clause (borrow-or-share, under jsonschema); more permissive than MIT
    "OFL-1.1", # fonts emitted by the web application retain their original font terms
    "Unlicense", # public-domain web libraries and their fallback permission text
    "Unicode-3.0",
    "Zlib",
    "bzip2-1.0.6", # attribution and unchanged-origin notices remain in the bundle
]
# MPL applies to ece's own files, which are unmodified and separately licensed;
# it permits linking into an Apache-2.0 larger work. The release's license list
# gives recipients the exact version's source download and includes its license.
exceptions = [{ crate = "ece@2.4.2", allow = ["MPL-2.0"] }]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Private path dependencies use the workspace version and cannot resolve to
# a registry release. Registry and Git sources remain restricted below.
allow-wildcard-paths = true
deny = [
    { crate = "web-push", reason = "Push uses ece and p256 directly; this wrapper adds an unused RSA signing stack." },
]

# These exact old versions are required by the two disjoint parent ranges
# beside each entry. No dependency subtree or advisory class is excluded.
skip = [
    { crate = "miniz_oxide@0.8.9", reason = "png 0.18.1 (^0.8, under image and tiny-skia) and flate2 1.1.10 (^0.9) require different version ranges." },
    { crate = "cipher@0.4.4", reason = "des 0.8.1 (^0.4), for the RFB (VNC) password challenge, and the 0.5 line used elsewhere require different version ranges; no stable des on cipher 0.5 yet." },
    { crate = "inout@0.1.4", reason = "cipher 0.4.4 (for des 0.8.1, the VNC password challenge) and cipher 0.5.2 require different inout ranges." },
    { crate = "base64@0.22.1", reason = "axum 0.8.9 (^0.22.1) and email-encoding 0.4.2 (^0.23) require different version ranges." },
    { crate = "bitflags@1.3.2", reason = "portable-pty 0.9.0 (^1.3) and dispatch2 0.3.1 (^2.5.0) require different version ranges." },
    { crate = "block-buffer@0.10.4", reason = "digest 0.10.7 (^0.10) and cipher 0.5.2 (^0.12) require different version ranges." },
    { crate = "cfg_aliases@0.1.1", reason = "nix 0.28.0 (^0.1.1) and nix 0.31.3 (^0.2.1) require different version ranges." },
