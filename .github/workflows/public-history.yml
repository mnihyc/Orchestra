name: Public commit messages
on: workflow_call

permissions:
  contents: read

jobs:
  messages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check the public history
        run: |
          python3 -I -B -m unittest discover -s .github/scripts -p test_release_commit_messages.py
          python3 -I -B .github/scripts/commit_messages.py
